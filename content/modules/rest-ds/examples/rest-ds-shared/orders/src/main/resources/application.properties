jmix.core.additional-stores=customers,products
jmix.core.store-descriptor-customers=restds_RestDataStoreDescriptor
jmix.core.store-descriptor-products=restds_RestDataStoreDescriptor

customers.baseUrl=http://localhost:8081
customers.clientId=orders-app
customers.clientSecret=orders123

products.baseUrl=http://localhost:8082
products.clientId=orders-app
products.clientSecret=orders123

main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/orders
main.datasource.username=sa
main.datasource.password=

main.liquibase.change-log=com/company/orders/liquibase/changelog.xml

jmix.core.available-locales=en

logging.level.org.atmosphere=warn

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.io.jmix.restds=debug
