main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/emailex1
main.datasource.username=sa
main.datasource.password=

main.liquibase.change-log=com/company/emailex1/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/company/emailex1/menu.xml
jmix.ui.composite-menu=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

logging.level.org.atmosphere=warn

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

# tag::spring-boot-properties[]
spring.mail.host=smtp.company.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=username
spring.mail.password=password
# end::spring-boot-properties[]

# tag::java-mail-properties[]
spring.mail.properties.mail.smtp.auth=true
# end::java-mail-properties[]

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# tag::jmix-email-properties[]
jmix.email.from-address=username@company.com
# end::jmix-email-properties[]

# tag::fs-enable[]
jmix.email.use-file-storage=true
# end::fs-enable[]

# tag::quartz[]
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always
# end::quartz[]

# tag::email-sending-cron[]
jmix.email.email-sending-cron=* 0/2 * * * ?
# end::email-sending-cron[]
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass = org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
main.datasource.studio.liquibase.excludePrefixes = qrtz_