main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/samlex1
main.datasource.username=sa
main.datasource.password=

main.liquibase.change-log=com/company/samlex1/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/company/samlex1/menu.xml
jmix.ui.composite-menu=true

ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

jmix.core.available-locales=en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn

server.port=8081

spring.security.saml2.relyingparty.registration.keycloak.entity-id=http://localhost:8081/saml/sp
spring.security.saml2.relyingparty.registration.keycloak.acs.location=http://localhost:8081/login/saml2/sso/keycloak
spring.security.saml2.relyingparty.registration.keycloak.assertingparty.metadata-uri=http://127.0.0.1:8080/realms/test-realm/protocol/saml/descriptor

spring.security.saml2.relyingparty.registration.keycloak.singlelogout.url=http://127.0.0.1:8080/realms/test-realm/protocol/saml
spring.security.saml2.relyingparty.registration.keycloak.singlelogout.response-url=http://localhost:8081/logout/saml2/slo

spring.security.saml2.relyingparty.registration.keycloak.signing.credentials[0].private-key-location=classpath:private-pkcs8.key
spring.security.saml2.relyingparty.registration.keycloak.signing.credentials[0].certificate-location=classpath:public.crt

spring.security.saml2.relyingparty.registration.keycloak.assertingparty.verification.credentials[0].certificate-location=classpath:keycloak-signing.crt